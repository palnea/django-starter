name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  # Job to set up the environment and install dependencies
  setup:
    name: Set up Environment and Check Code Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=2.1.3 python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies with Poetry
        run: |
          poetry install --no-root

      - name: Run Black
        run: |
          echo "Running Black check..."
          poetry run black --check .

  # Job to run Django tests after the setup
  run_tests:
    name: Run Django Tests
    runs-on: ubuntu-latest
    needs: setup
    services:
      # Add PostgreSQL as a service
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=2.1.3 python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies with Poetry
        run: |
          poetry install --no-root

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Compile Django messages
        run: poetry run python manage.py compilemessages

      - name: Run Django tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        run: |
          echo "Finding and running test files..."
          temp_file=$(mktemp)
          trap "rm -f $temp_file" EXIT
          
          # Find and store unique test directories
          find . -type f -name "test_*.py" -exec dirname {} \; | sort -u > $temp_file

          while IFS= read -r dir; do
              echo "Running Django tests in $dir..."
              poetry run python manage.py test "$dir" --settings=settings.local_test
              if [ $? -ne 0 ]; then
                  echo "Tests failed in $dir. Please fix the tests and try again."
                  exit 1
              fi
          done < "$temp_file"
